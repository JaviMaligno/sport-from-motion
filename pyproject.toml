[project]
name = "motion-sport"
version = "0.0.1"
description = "Which sport is this? Identifying team sports from player movement alone — experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# frozen video encoders (V-JEPA 2, VideoMAE) for the probe baseline; also DeepSets
probe = ["torch>=2.3", "transformers>=4.53"]
# MiniRocket time-series classifier (random convolution kernels + linear fit)
series = ["aeon>=1.0"]
# Laya typed-decision model in-process (Apache-2.0); not needed for laya-http:
laya = ["laya>=0.3.20"]
dev = ["pytest>=8"]

[project.scripts]
motion-sport = "motion_sport.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motion_sport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
